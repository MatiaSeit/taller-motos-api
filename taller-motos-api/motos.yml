info:
  name: motos
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8080/motos
  body:
    type: json
    data: |-
      {
        "matricula": "ABC123",
        "marca": "Honda",
        "modelo": "CBR500R",
        "anio": 2020,
        "cilindrada": 500,
        "color": "Rojo"
      }
  auth:
    type: basic
    username: user
    password: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
